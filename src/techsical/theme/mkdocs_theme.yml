# Tema techsical: extiende el tema de Zensical y fija sus valores por defecto.
# Lo que la web ponga en [project.theme] de su zensical.toml manda sobre esto.
extends: zensical

language: es
# Las fuentes van en el propio tema (assets/fonts, fonts.css): sin Google Fonts.
font: false
favicon: assets/favicon/favicon-32x32.png

# navigation.footer (anterior/siguiente al pie) queda oculta salvo con
# footer_nav = true en [project.extra.techsical]. Sin navigation.instant: cambia
# de página sin recargar y anula las transiciones entre páginas del tema.
features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.path
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.highlight
  - toc.follow

# Claro, oscuro y preferencia del sistema; los colores salen de techsical.css.
palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: lucide/sun-moon
      name: Cambiar a modo claro
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun
      name: Cambiar a modo oscuro
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: lucide/moon
      name: Cambiar a la preferencia del sistema
